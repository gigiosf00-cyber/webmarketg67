<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBMARKETG67 TikTok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f5; margin: 0; padding: 0; }
        .header { text-align: center; background: #000; color: #fff; padding: 20px 10px; font-weight: 800; font-size: 22px; }
        .header span { color: #fe2c55; }
        .search-box { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        .search-box input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 25px; box-sizing: border-box; font-size: 15px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; padding: 15px; }
        .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-content { padding: 10px; text-align: left; }
        .card-ref { font-size: 12px; font-weight: bold; color: #888; }
        .title { font-size: 14px; margin: 5px 0; color: #333; }
        .actions { margin-top: 10px; }
        .btn-card { display: block; width: 100%; padding: 10px 0; text-align: center; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 13px; box-sizing: border-box; }
        .btn-buy { background: #000; color: #fff; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        WEBMARKET<span>G67</span> TikTok
    </div>
    
    <div class="search-box">
        <input type="text" id="codigoBusca" placeholder="Digite o código (Ex: T1)...">
    </div>

    <div id="product-grid" class="grid">
        <!-- O robô vai adicionar os produtos aqui -->
    </div>

    <script>
        // Tag para insercao dos cards
    </script>
</body>
</html>
