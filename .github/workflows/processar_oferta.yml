name: Processar Ofertas Webmarket

on:
  workflow_dispatch:
    inputs:
      imagem_url:
        description: 'URL da Imagem do Produto'
        required: true
      tag_oferta:
        description: 'Codigo da Oferta (ex: SG1 ou S61)'
        required: true
      link_afiliado:
        description: 'Link de Afiliado Shopee'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Codigo do Repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Executar Script de Edicao e Publicacao
        run: |
          python -c "
          import os, re, requests
          from PIL import Image, ImageDraw, ImageFont

          img_url = '''${{ github.event.inputs.imagem_url }}'''.strip()
          tag_raw = '''${{ github.event.inputs.tag_oferta }}'''.strip()
          link = '''${{ github.event.inputs.link_afiliado }}'''.strip()

          tag_chave = re.sub(r'^([a-z]+)0*(\d+)$', r'\1\2', tag_raw.lower())

          resp = requests.get(img_url)
          with open('temp.jpg', 'wb') as f:
              f.write(resp.content)

          img = Image.open('temp.jpg').convert('RGB')
          largura, altura = 1080, 1920
          fundo = Image.new('RGB', (largura, altura), (245, 245, 245))

          img.thumbnail((largura - 80, altura - 200), Image.Resampling.LANCZOS)
          pos_x = (largura - img.width) // 2
          pos_y = (altura - img.height) // 2
          fundo.paste(img, (pos_x, pos_y))

          draw = ImageDraw.Draw(fundo)
          try:
              fonte = ImageFont.truetype('arial.ttf', 80)
          except:
              fonte = ImageFont.load_default()

          draw.rectangle([50, altura - 150, largura - 50, altura - 50], fill=(238, 77, 45))
          draw.text((80, altura - 130), f'#{tag_chave.upper()}', fill=(255, 255, 255), font=fonte)

          os.makedirs('img/shopee', exist_ok=True)
          caminho_imagem = f'img/shopee/{tag_chave}.jpg'
          fundo.save(caminho_imagem, quality=90)

          if os.path.exists('index.html'):
              with open('index.html', 'r', encoding='utf-8') as f:
                  conteudo = f.read()
              nova_linha = f'  \"{tag_chave}\": \"{link}\",\n'
              if f'\"{tag_chave}\":' in conteudo:
                  conteudo = re.sub(rf'\"{tag_chave}\":\s*\"[^\"]*\"', f'\"{tag_chave}\": \"{link}\"', conteudo)
              else:
                  conteudo = conteudo.replace('const destinos = {', f'const destinos = {{\n{nova_linha}')
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(conteudo)

          card_html = f'''
            <div class=\"card\">
              <a href=\"{link}\" target=\"_blank\">
                <img src=\"img/shopee/{tag_chave}.jpg\" alt=\"Oferta #{tag_chave.upper()}\">
              </a>
            </div>
          '''

          # Decidir a vitrine com base no prefixo da tag (se começa com sg vai para shopee_geral.html, senão vai para shopee.html)
          if tag_chave.startswith('sg'):
              vitrines = ['shopee_geral.html']
          else:
              vitrines = ['shopee.html']

          for vitrine in vitrines:
              if os.path.exists(vitrine):
                  with open(vitrine, 'r', encoding='utf-8') as f:
                      pag_html = f.read()
                  if f'img/shopee/{tag_chave}.jpg' not in pag_html:
                      if '<!-- PRODUTOS_INICIO -->' in pag_html:
                          pag_html = pag_html.replace('<!-- PRODUTOS_INICIO -->', f'<!-- PRODUTOS_INICIO -->\n{card_html}')
                      elif '<div class=\"grid\">' in pag_html:
                          pag_html = pag_html.replace('<div class=\"grid\">', f'<div class=\"grid\">\n{card_html}')
                      elif '<div class=\"links-grid\">' in pag_html:
                          pag_html = pag_html.replace('<div class=\"links-grid\">', f'<div class=\"links-grid\">\n{card_html}')
                      else:
                          pag_html = pag_html.replace('</body>', f'{card_html}\n</body>')
                      with open(vitrine, 'w', encoding='utf-8') as f:
                          f.write(pag_html)
          "

      - name: Salvar e Publicar no GitHub Pages
        run: |
          git config --global user.name "Bot Webmarket"
          git config --global user.email "bot@webmarketg67.com"
          git add .
          git commit -m "Processa oferta inteligentemente por vitrine" || exit 0
          git push
