name: Adicionar/Atualizar Produto

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Código do produto (ex: S58)'
        required: true
      title:
        description: 'Título do produto'
        required: true
      target_url:
        description: 'Link de Afiliado Shopee'
        required: true
      video_url:
        description: 'Link do Vídeo (Opcional)'
        required: false
        default: '#'

jobs:
  add_product:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Executar script de atualização
        env:
          PRODUCT_CODE: ${{ github.event.inputs.code }}
          PRODUCT_TITLE: ${{ github.event.inputs.title }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: node scripts/add_product.js

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html shopee.html
          git commit -m "Auto: produto ${{ github.event.inputs.code }} adicionado/atualizado" || echo "Sem mudanças"
          git push

