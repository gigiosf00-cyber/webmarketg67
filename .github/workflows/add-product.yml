name: Adicionar/Atualizar Produto

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma'
        required: true
        type: choice
        options:
        - shopee
        - tiktok
        - amazon
        - mercadolivre
      code:
        description: 'Código (ex: S61)'
        required: true
      title:
        description: 'Título'
        required: true
      target_url:
        description: 'Link de Afiliado'
        required: true

jobs:
  add_product:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: node scripts/add_product.js
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          PRODUCT_CODE: ${{ github.event.inputs.code }}
          PRODUCT_TITLE: ${{ github.event.inputs.title }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "Auto: ${{ github.event.inputs.platform }} - ${{ github.event.inputs.code }}" || echo "Sem mudanças"
          git push
